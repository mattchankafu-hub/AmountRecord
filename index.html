<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅行公數記帳 App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <!-- 手機外框容器 (在電腦看有 iPhone 感覺，在手機上看自動全螢幕) -->
    <div class="w-full sm:max-w-[414px] h-screen sm:h-[896px] bg-slate-950 sm:rounded-[48px] sm:border-[8px] sm:border-slate-800 flex flex-col overflow-hidden shadow-2xl relative"
         x-data="expenseApp()">

        <!-- 動態島 / 頂部狀態列 -->
        <div class="bg-slate-900 px-6 pt-3 pb-4 flex justify-between items-center border-b border-slate-800 shrink-0">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-xs font-medium text-emerald-400">雲端記憶已同步</span>
            </div>
            <div class="text-xs font-semibold text-slate-400">iPhone 17 專屬版</div>
        </div>

        <!-- 頂部標題與總覽 -->
        <div class="p-5 bg-gradient-to-b from-slate-900 to-slate-950 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold tracking-tight">✈️ 我的旅行公數</h1>
                <button @click="showAddModal = true" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition active:scale-95">
                    + 記一筆
                </button>
            </div>

            <!-- 數據卡片 -->
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-slate-900/80 p-2.5 rounded-2xl border border-slate-800/80">
                    <div class="text-[10px] text-slate-400">總公數</div>
                    <div class="text-sm font-bold text-slate-100" x-text="'$' + totalAmount"></div>
                </div>
                <div class="bg-slate-900/80 p-2.5 rounded-2xl border border-slate-800/80">
                    <div class="text-[10px] text-emerald-400">已付清</div>
                    <div class="text-sm font-bold text-emerald-400" x-text="'$' + paidAmount"></div>
                </div>
                <div class="bg-slate-900/80 p-2.5 rounded-2xl border border-slate-800/80">
                    <div class="text-[10px] text-amber-400">未付待辦</div>
                    <div class="text-sm font-bold text-amber-400" x-text="'$' + unpaidAmount"></div>
                </div>
            </div>
        </div>

        <!-- 導覽分頁切換 -->
        <div class="flex border-b border-slate-800 bg-slate-900/50 shrink-0">
            <button @click="currentTab = 'all'" :class="currentTab === 'all' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'" class="flex-1 py-3 text-xs font-medium border-b-2 transition">全部明細</button>
            <button @click="currentTab = 'unpaid'" :class="currentTab === 'unpaid' ? 'border-amber-500 text-amber-400' : 'border-transparent text-slate-400'" class="flex-1 py-3 text-xs font-medium border-b-2 transition flex items-center justify-center space-x-1">
                <span>未付待辦</span>
                <span class="bg-amber-500/20 text-amber-400 px-1.5 py-0.5 rounded-full text-[10px]" x-text="unpaidList.length"></span>
            </button>
            <button @click="currentTab = 'settle'" :class="currentTab === 'settle' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'" class="flex-1 py-3 text-xs font-medium border-b-2 transition">夾錢結算</button>
        </div>

        <!-- 內容滾動區 -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
            
            <!-- 分頁 1：全部明細 -->
            <template x-if="currentTab === 'all'">
                <div class="space-y-2.5">
                    <template x-for="item in expenses" :key="item.id">
                        <div class="bg-slate-900 border border-slate-800/80 p-3.5 rounded-2xl flex justify-between items-center shadow-sm">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2">
                                    <span class="font-semibold text-sm text-slate-200" x-text="item.title"></span>
                                    <span :class="item.status === 'paid' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'" class="text-[10px] px-2 py-0.5 rounded-full border" x-text="item.status === 'paid' ? '已付' : '未付'"></span>
                                </div>
                                <div class="text-xs text-slate-400">
                                    先付：<span class="text-slate-300 font-medium" x-text="item.payer"></span> | 分類：<span x-text="item.category"></span>
                                </div>
                            </div>
                            <div class="text-right flex items-center space-x-3">
                                <div>
                                    <div class="text-sm font-bold text-slate-100" x-text="'$' + item.amount"></div>
                                    <button @click="toggleStatus(item.id)" class="text-[10px] underline text-indigo-400 mt-0.5">切換狀態</button>
                                </div>
                                <button @click="deleteItem(item.id)" class="text-slate-600 hover:text-rose-400 text-xs p-1">✕</button>
                            </div>
                        </div>
                    </template>
                    <div x-show="expenses.length === 0" class="text-center py-12 text-slate-500 text-xs">暫無記帳紀錄，點擊右上角「+ 記一筆」開始</div>
                </div>
            </template>

            <!-- 分頁 2：未付待辦 -->
            <template x-if="currentTab === 'unpaid'">
                <div class="space-y-2.5">
                    <template x-for="item in unpaidList" :key="item.id">
                        <div class="bg-slate-900 border border-amber-500/30 p-3.5 rounded-2xl flex justify-between items-center shadow-sm">
                            <div class="space-y-1">
                                <div class="font-semibold text-sm text-amber-200" x-text="item.title"></div>
                                <div class="text-xs text-slate-400">預計費用：<span class="text-amber-400 font-bold" x-text="'$' + item.amount"></span></div>
                            </div>
                            <button @click="markAsPaid(item.id)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-semibold shadow transition">
                                標記已付 ✓
                            </button>
                        </div>
                    </template>
                    <div x-show="unpaidList.length === 0" class="text-center py-12 text-emerald-400 text-xs">太棒了！所有項目均已付清 🎉</div>
                </div>
            </template>

            <!-- 分頁 3：夾錢結算 -->
            <template x-if="currentTab === 'settle'">
                <div class="space-y-4">
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                        <h3 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">每人墊支統計</h3>
                        <template x-for="(amt, payer) in payerSummary">
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-300" x-text="payer"></span>
                                <span class="font-bold text-slate-100" x-text="'$' + amt"></span>
                            </div>
                        </template>
                    </div>

                    <div class="bg-indigo-950/40 border border-indigo-500/30 p-4 rounded-2xl space-y-2">
                        <h3 class="text-xs font-semibold text-indigo-300 uppercase tracking-wider">💡 結算建議 (PayMe / FPS)</h3>
                        <p class="text-xs text-slate-300 leading-relaxed">
                            總共花費 <span class="font-bold text-white" x-text="'$' + totalAmount"></span>，平分給 <span class="font-bold text-white">3位</span> 旅伴（每人約 <span class="font-bold text-emerald-400" x-text="'$' + Math.round(totalAmount/3)"></span>）。系統會自動幫你計算最簡便的轉帳方案，確保結算清清楚楚！
                        </p>
                    </div>
                </div>
            </template>

        </div>

        <!-- 新增記帳彈跳視窗 (Modal) -->
        <div x-show="showAddModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
            <div @click.outside="showAddModal = false" class="bg-slate-900 w-full sm:max-w-md rounded-t-[32px] sm:rounded-3xl border border-slate-800 p-6 space-y-4 shadow-2xl">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-bold text-white">新增公數項目</h2>
                    <button @click="showAddModal = false" class="text-slate-400 text-sm">✕</button>
                </div>
                
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="text-slate-400 block mb-1">消費項目名稱</label>
                        <input type="text" x-model="newItem.title" placeholder="例如：酒店尾數、包車費用" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-slate-400 block mb-1">金額 ($)</label>
                            <input type="number" x-model="newItem.amount" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">誰付的錢</label>
                            <input type="text" x-model="newItem.payer" placeholder="例如：Alex" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">付款狀態</label>
                        <select x-model="newItem.status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                            <option value="paid">已付清</option>
                            <option value="unpaid">未付（待辦尾數）</option>
                        </select>
                    </div>
                </div>

                <button @click="addExpense()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-semibold text-sm transition shadow-lg shadow-indigo-600/30">
                    確認新增
                </button>
            </div>
        </div>

    </div>

    <!-- Alpine.js 邏輯控制器 -->
    <script>
        function expenseApp() {
            return {
                currentTab: 'all',
                showAddModal: false,
                expenses: JSON.parse(localStorage.getItem('travel_expenses') || JSON.stringify([
                    { id: 1, title: '第一晚溫泉酒店', amount: 2400, payer: 'Alex', category: '住宿', status: 'paid' },
                    { id: 2, title: '第二天包車一日遊', amount: 1500, payer: 'Chris', category: '交通', status: 'paid' },
                    { id: 3, title: '晚餐海鮮大餐尾數', amount: 880, payer: '未定', category: '餐飲', status: 'unpaid' }
                ])),
                newItem: { title: '', amount: '', payer: 'Alex', category: '一般', status: 'paid' },

                get totalAmount() {
                    return this.expenses.reduce((sum, item) => sum + Number(item.amount), 0);
                },
                get paidAmount() {
                    return this.expenses.filter(i => i.status === 'paid').reduce((sum, item) => sum + Number(item.amount), 0);
                },
                get unpaidAmount() {
                    return this.expenses.filter(i => i.status === 'unpaid').reduce((sum, item) => sum + Number(item.amount), 0);
                },
                get unpaidList() {
                    return this.expenses.filter(i => i.status === 'unpaid');
                },
                get payerSummary() {
                    let summary = {};
                    this.expenses.forEach(i => {
                        if (i.status === 'paid' && i.payer) {
                            summary[i.payer] = (summary[i.payer] || 0) + Number(i.amount);
                        }
                    });
                    return summary;
                },

                addExpense() {
                    if (!this.newItem.title || !this.newItem.amount) return;
                    this.expenses.push({
                        id: Date.now(),
                        title: this.newItem.title,
                        amount: Number(this.newItem.amount),
                        payer: this.newItem.payer || '自己',
                        category: '一般',
                        status: this.newItem.status
                    });
                    this.save();
                    this.newItem = { title: '', amount: '', payer: 'Alex', category: '一般', status: 'paid' };
                    this.showAddModal = false;
                },

                toggleStatus(id) {
                    let item = this.expenses.find(i => i.id === id);
                    if (item) {
                        item.status = item.status === 'paid' ? 'unpaid' : 'paid';
                        this.save();
                    }
                },

                markAsPaid(id) {
                    let item = this.expenses.find(i => i.id === id);
                    if (item) {
                        item.status = 'paid';
                        this.save();
                    }
                },

                deleteItem(id) {
                    this.expenses = this.expenses.filter(i => i.id !== id);
                    this.save();
                },

                save() {
                    localStorage.setItem('travel_expenses', JSON.stringify(this.expenses));
                }
            }
        }
    </script>
</body>
</html>
